{% extends "base.html" %}
{% block title %}404 - Tidak Ditemukan{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="error-code">404</div>
    <h3>Data atau halaman tidak ditemukan</h3>
    <p class="text-muted">
        Halaman yang Anda cari tidak tersedia, atau data dengan ID tersebut tidak ada di database.
    </p>
    <a href="{{ url_for('beranda') }}" class="btn btn-primary">Kembali ke Beranda</a>
</div>
{% endblock %}
